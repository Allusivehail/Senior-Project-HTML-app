<!DOCTYPE html>
<html>
<head>
    <title>Fridge Diagnostics</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f0f2f5;
            --white: #ffffff;
            --surface: #fafbfc;
            --border: #e2e6ea;
            --accent: #0069d9;
            --text: #1a2332;
            --text-mid: #4a5568;
            --text-muted: #8a95a3;
            --serif: 'Instrument Serif', serif;
            --sans: 'DM Sans', sans-serif;
            --mono: 'DM Mono', monospace;
            --radius: 16px;
            --shadow: 0 2px 10px rgba(0,0,0,0.08);

            --green: #28a745;
            --yellow: #ffc107;
            --red: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        /* ===== RED ALERT FLASH ===== */
        @keyframes boxRedFlash {
            0% { background-color: var(--surface); }
            50% { background-color: #ff4d4d; }
            100% { background-color: var(--surface); }
        }
        
        .gas-box.alert {
            animation: boxRedFlash 1s infinite;
        }

        .topbar {
            background: white;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .topbar-wordmark {
            font-family: var(--serif);
            font-size: 20px;
        }

        .topbar-wordmark em {
            color: var(--accent);
        }

        .main {
            flex: 1;
            padding: 12px;
            display: flex;
        }

        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .card-body {
            flex: 1;
            padding: 12px;
            display: flex;
        }

        .gas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: 1fr;
            gap: 12px;
            width: 100%;
            height: 100%;
        }

        .gas-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gas-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .gas-value {
            font-size: 28px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="topbar-wordmark">Fridge <em>Sniffer</em></div>
    </div>

    <div class="main">
        <div class="card-body">
            <div class="gas-grid">

                <div class="gas-box">
                    <div class="gas-title">Ethanol</div>
                    <div class="gas-value" id="ethanol">--</div>
                </div>

                <div class="gas-box">
                    <div class="gas-title">Ammonia</div>
                    <div class="gas-value" id="ammonia">--</div>
                </div>

                <div class="gas-box">
                    <div class="gas-title">Hydrogen Sulfide</div>
                    <div class="gas-value" id="h2s">--</div>
                </div>

                <div class="gas-box">
                    <div class="gas-title">Temperature</div>
                    <div class="gas-value" id="temp">--</div>
                </div>

            </div>
        </div>
    </div>

<script>
        function formatValue(val) {
            if (val === null || val === undefined || isNaN(val)) return '--';
            return parseFloat(val).toFixed(2);
        }

        function getColor(value, greenMax, yellowMax, redMin) {
            if (value >= redMin) return "var(--red)";
            if (value >= yellowMax) return "var(--yellow)";
            return "var(--green)";
        }

        // returns TRUE if value is in RED zone
        function applyValue(id, value, greenMax, yellowMax, redMin, unit = '') {
            const el = document.getElementById(id);
        
            if (value === null || value === undefined || isNaN(value)) {
                el.textContent = '--';
                el.style.color = '';
                el.parentElement.classList.remove("alert");
                return false;
            }
        
            const num = parseFloat(value);
        
            el.textContent = num.toFixed(2) + unit;
            el.style.color = getColor(num, greenMax, yellowMax, redMin);
        
            const isRed = num >= redMin;
        
            // 🔴 per-box flashing
            if (isRed) {
                el.parentElement.classList.add("alert");
            } else {
                el.parentElement.classList.remove("alert");
            }
        
            return isRed;
        }

        async function loadGasData() {
            try {
                const res = await fetch('/api/gas-data');
                const data = await res.json();

                let anyRed = false;

                // KEEP ORIGINAL ORDER + MAPPING EXACTLY AS YOU HAD IT
                anyRed = anyRed || applyValue('ethanol', data.Temperature, 5.0, 5.1, 10.0, " PPM");
                anyRed = anyRed || applyValue('ammonia', data.Ethanol, 12.0, 12.1, 20.0, " PPM");
                anyRed = anyRed || applyValue('h2s', data.Ammonia, 3.0, 4.0, 5.0, " PPM");
                anyRed = anyRed || applyValue('temp', data["Hydrogen Sulfide"], 40.0, 41.1, 55.0, " F");

                if (anyRed) {
                    document.body.classList.add("alert");
                } else {
                    document.body.classList.remove("alert");
                }

            } catch (err) {
                console.error("Gas data fetch failed:", err);
            }
        }

        loadGasData();
        setInterval(loadGasData, 2000);
    </script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

<script>
    if (Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    const client = new Paho.MQTT.Client("10.100.138.163", 8083, "clientId");

    const connectOptions = {
        onSuccess: onConnect,
        useSSL: false,
        userName: "testUser",
        password: "pass"
    };

    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    client.connect(connectOptions);

    function onConnect() {
        console.log("Webpage connected to MQTT");
        client.subscribe("tempAlert");
        client.subscribe("sensorAlert");
    }

    function onConnectionLost(responseObject) {
        if (responseObject.errorCode !== 0) {
            console.log("onConnectionLost:" + responseObject.errorMessage);
        }
    }

    function onMessageArrived(message) {
        console.log("Message Arrived: " + message.payloadString);
        if (Notification.permission === "granted") {
            new Notification("New MQTT Message", {
                body: message.payloadString,
                icon: "https://cdn-icons-png.flaticon.com/512/1827/1827347.png"
            });
        } else {
            alert("MQTT Message: " + message.payloadString);
        }
    }
</script>

</body>
</html>
